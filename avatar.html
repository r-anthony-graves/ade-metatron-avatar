<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
<title>Ade</title>
<style>
  :root {
    --red:#8e1b2a; --vermilion:#d9451f; --orange:#ef7a1e;
    --amber:#f5a623; --yellow:#f7ce3e;
    --steel:#6e7681; --ink:#262a31;
    --panel:rgba(228,232,238,.92); --line:rgba(110,118,129,.34);
  }
  html, body {
    margin:0; padding:0; width:100%; height:100%;
    background:transparent; overflow:hidden;
    font-family:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
    color:var(--ink); user-select:none; cursor:default;
  }
  #glyph { position:absolute; top:0; left:0; display:block; }

  #bar {
    position:absolute; left:10px; right:10px; bottom:8px;
    background:var(--panel); border:1px solid var(--line);
    border-radius:9px; padding:8px 9px 9px;
    -webkit-backdrop-filter:blur(11px); backdrop-filter:blur(11px);
    box-shadow:0 10px 30px rgba(40,30,20,.28);
    opacity:0; transform:translateY(9px); pointer-events:none;
    transition:opacity .16s ease, transform .16s ease;
  }
  #bar.open { opacity:1; transform:none; pointer-events:auto; }

  .row { display:flex; align-items:center; gap:7px; }
  #mode {
    font-size:9.5px; letter-spacing:.14em; text-transform:uppercase;
    color:var(--steel); white-space:nowrap; flex:0 0 auto;
    border:1px solid var(--line); border-radius:3px; padding:3px 5px;
  }
  #mode.task  { color:#b3540f; border-color:rgba(239,122,30,.6);  background:rgba(239,122,30,.10); }
  #mode.shell { color:#fff;    border-color:var(--red); background:var(--red); }
  #mode.ask   { color:#8a5a08; border-color:rgba(245,166,35,.65); background:rgba(245,166,35,.13); }

  /* The mute control. An always-open microphone with no visible state is the
     bad version of this feature, so the button states what is true rather
     than what you may do to it -- and `muted` is loud, because a stopped
     track is the safe state and you should be able to see it across a room. */
  #mic {
    flex:0 0 auto; font-size:9.5px; letter-spacing:.12em; text-transform:uppercase;
    border:1px solid rgba(110,118,129,.5); border-radius:3px; padding:3px 6px;
    background:rgba(255,255,255,.5); color:var(--steel); cursor:pointer;
  }
  #mic:hover { border-color:var(--steel); }
  #mic.muted { color:#fff; background:var(--red); border-color:var(--red); }

  #in {
    flex:1 1 auto; min-width:0; background:rgba(255,255,255,.62); color:var(--ink);
    border:1px solid var(--line); border-radius:5px;
    padding:6px 8px; font:400 12.5px/1.3 "Segoe UI",system-ui,sans-serif;
    outline:none; user-select:text; cursor:text;
  }
  #in:focus { border-color:rgba(239,122,30,.75); }
  #in::placeholder { color:rgba(110,118,129,.7); }

  #out {
    margin-top:7px; max-height:150px; overflow:auto; display:none;
    font:400 11.5px/1.5 "Cascadia Mono","Consolas",ui-monospace,monospace;
    color:#333840; white-space:pre-wrap; word-break:break-word;
    background:rgba(255,255,255,.58); border-radius:5px; padding:7px 8px;
    user-select:text; cursor:text;
  }
  #out.show { display:block; }
  #out.err { color:var(--red); }

  #hint { margin-top:6px; font-size:9.5px; letter-spacing:.06em; color:rgba(110,118,129,.85); }

  /* A drop target has to look like one while a file is over it. */
  #bar.dropping { outline:2px dashed rgba(88,166,255,.55); outline-offset:-4px; }

  /* Attached procedures. Visible whenever any are on, because a skill that
     silently governs the turn is indistinguishable from one that was dropped. */
  #skills { display:none; margin-top:7px; }
  #skills.show { display:block; }
  #skills span {
    display:inline-block; margin:0 4px 3px 0; padding:1px 6px; border-radius:9px;
    font-size:9.5px; letter-spacing:.04em;
    background:rgba(88,166,255,.12); color:#2f6ab8; border:1px solid rgba(88,166,255,.3);
  }

  #approve { display:none; margin-top:7px; }
  #approve.show { display:block; }
  #approve .what {
    font:400 11px/1.45 "Cascadia Mono","Consolas",ui-monospace,monospace;
    color:#6d1420; background:rgba(217,69,31,.12);
    border:1px solid rgba(142,27,42,.45); border-radius:5px; padding:6px 7px;
    max-height:74px; overflow:auto; white-space:pre-wrap; word-break:break-all;
  }
  .btns { display:flex; gap:6px; margin-top:6px; }
  button {
    flex:1 1 0; font:600 10.5px/1 "Segoe UI",system-ui,sans-serif;
    letter-spacing:.12em; text-transform:uppercase; padding:7px 6px;
    border-radius:5px; border:1px solid var(--line);
    background:rgba(255,255,255,.5); color:var(--ink); cursor:pointer;
  }
  button:hover { background:rgba(255,255,255,.85); }
  button:focus-visible { outline:2px solid var(--orange); outline-offset:2px; }
  button.allow { border-color:rgba(122,140,60,.6); color:#4d5a1c; background:rgba(200,215,140,.35); }
  button.deny  { border-color:rgba(142,27,42,.55);  color:var(--red); background:rgba(217,69,31,.12); }
  .spin { color:#b3540f; }
</style>
</head>
<body>
  <canvas id="glyph"></canvas>

  <div id="bar">
    <div class="row">
      <span id="mode" class="task">Task</span>
      <button id="mic" type="button" title="The microphone is open. Click to stop the track.">Mute</button>
      <input id="in" type="text" spellcheck="false" autocomplete="off"
             placeholder="Tell Ade what to do…">
    </div>
    <div id="approve">
      <div class="what" id="approveWhat"></div>
      <div class="btns">
        <button class="allow" id="allow">Allow</button>
        <button class="deny"  id="deny">Deny</button>
      </div>
    </div>
    <div id="out"></div>
    <div id="skills"></div>
    <div id="hint">Enter to send · <b>!</b> shell (ungated) · <b>?</b> ask · <b>/type</b> task type · <b>/skill</b> attach a procedure · <b>/upload</b> files, or drop them here · <b id="talkKey">tray menu</b> to speak · Esc to hide</div>
  </div>

  <script src="glyph.js"></script>
  <script src="ptt.js"></script>
  <script src="ui.js"></script>
</body>
</html>
